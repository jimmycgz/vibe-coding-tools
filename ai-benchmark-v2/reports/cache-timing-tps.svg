<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 226" width="900" height="226" role="img" aria-label="Output tokens per second, by cache state">
<title>Output tokens per second, by cache state</title>
<desc>10 repetitions per cell, one request at a time, a different question in each state.</desc>
<rect width="900" height="226" fill="#fbfaf7"/>
<g font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" fill="#1d2430">
<text x="20" y="30" font-size="19" font-weight="700">Output tokens per second, by cache state</text>
<text x="20" y="52" font-size="13" fill="#5a6472">10 repetitions per cell, one request at a time, a different question in each state.</text>
<rect x="190" y="64" width="12" height="12" fill="#8c97a3"/><text x="208" y="75" font-size="12">no cache</text><rect x="380" y="64" width="12" height="12" fill="#e0a030"/><text x="398" y="75" font-size="12">cold cache (writes)</text><rect x="570" y="64" width="12" height="12" fill="#3b8f6b"/><text x="588" y="75" font-size="12">warm cache (reads)</text><line x1="190.0" y1="94" x2="190.0" y2="156" stroke="#dcd8cf" stroke-width="1"/>
<text x="190.0" y="172" font-size="11" text-anchor="middle" fill="#5a6472">0</text>
<line x1="345.0" y1="94" x2="345.0" y2="156" stroke="#dcd8cf" stroke-width="1"/>
<text x="345.0" y="172" font-size="11" text-anchor="middle" fill="#5a6472">50</text>
<line x1="500.0" y1="94" x2="500.0" y2="156" stroke="#dcd8cf" stroke-width="1"/>
<text x="500.0" y="172" font-size="11" text-anchor="middle" fill="#5a6472">100</text>
<line x1="655.0" y1="94" x2="655.0" y2="156" stroke="#dcd8cf" stroke-width="1"/>
<text x="655.0" y="172" font-size="11" text-anchor="middle" fill="#5a6472">150</text>
<line x1="810.0" y1="94" x2="810.0" y2="156" stroke="#dcd8cf" stroke-width="1"/>
<text x="810.0" y="172" font-size="11" text-anchor="middle" fill="#5a6472">200</text>
<text x="500.0" y="192" font-size="12" text-anchor="middle" fill="#5a6472">Output tokens per second after the first token (median)</text>

<text x="180" y="122" font-size="13" text-anchor="end">Sonnet long</text>
<rect x="190" y="98" width="394.2" height="14" rx="2" fill="#8c97a3"/>
<text x="589.2" y="109" font-size="11" font-weight="600">127.2</text>
<rect x="190" y="115" width="396.3" height="14" rx="2" fill="#e0a030"/>
<text x="591.3" y="126" font-size="11" font-weight="600">127.8</text>
<rect x="190" y="132" width="415.2" height="14" rx="2" fill="#3b8f6b"/>
<text x="610.2" y="143" font-size="11" font-weight="600">133.9</text>
<text x="20" y="212" font-size="12" fill="#5a6472">Latest models: Opus 5.5, Sonnet 5.5, Fable 5.1. 13k = ~13,000-token prefix; long = plus the claims ledger. Cold writes; warm reads.</text>
</g>
</svg>
